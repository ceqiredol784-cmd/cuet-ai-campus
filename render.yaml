services:
  # -------------------------------------------------------------------
  # 1. Backend Web Service (Node.js / Express API)
  # -------------------------------------------------------------------
  - type: web
    name: cuet-ai-campus-api
    runtime: node
    plan: free
    rootDir: cuet-ai-campus-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: AUTO_SEED
        value: 'false'

  # -------------------------------------------------------------------
  # 2. Frontend Static Site (React / Vite SPA)
  # -------------------------------------------------------------------
  - type: web
    name: cuet-ai-campus-web
    runtime: static
    rootDir: cuet-ai-campus-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed API URL, e.g. https://cuet-ai-campus-api.onrender.com/api/v1
